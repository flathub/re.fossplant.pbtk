app-id: re.fossplant.pbtk

runtime: org.gnome.Platform
runtime-version: "51"

sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk8

command: pbtk

finish-args:
  - --share=network
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - python3-modules.yaml

  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk8/install.sh

  - name: pbtk
    buildsystem: simple
    build-commands:
      - install -Dm644 src/pbtk/ui/assets/re.fossplant.pbtk.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 src/pbtk/ui/assets/re.fossplant.pbtk.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 src/pbtk/ui/assets/re.fossplant.pbtk.desktop -t /app/share/applications/
      - rm -rf *.g* *.md *.py *.toml *.yaml *.lock src packaging
    sources:
      - type: git
        url: https://github.com/marin-m/pbtk
        tag: 2.0.0
        commit: 7bc64ba789822e706903dd802d9599ddbd508b9a
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
